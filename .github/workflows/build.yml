name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Follow-ups.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Follow-ups-apk
          path: Follow-ups.apk

      - name: Publish result to the builds branch
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          echo "${{ job.status }} ${GITHUB_SHA::7} $(date -u +%FT%TZ)" > STATUS.txt
          tail -n 150 build.log > build-tail.log 2>/dev/null || true
          git checkout --orphan builds
          git rm -rf --cached . > /dev/null
          git add -f STATUS.txt build-tail.log
          [ -f Follow-ups.apk ] && git add -f Follow-ups.apk || true
          git commit -m "Build ${GITHUB_SHA::7}: ${{ job.status }}"
          git push -f origin builds
