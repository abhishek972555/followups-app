plugins { id 'com.android.application' }

android {
    namespace 'app.followups'
    compileSdk 34

    defaultConfig {
        applicationId "app.followups"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'followups'
            keyAlias 'followups'
            keyPassword 'followups'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
